<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remasto - Interview Practice</title>
  <link rel="stylesheet" href="i.css">
</head>
<body>

<header>
  <div class="logo">
    <img src="your-logo-here.png" alt="Remasto Logo" height="50">
  </div>
  <nav>
    <a href="#">Interviews</a>
    <a href="#">Resume</a>
    <a href="#">Solutions</a>
    <a href="#">Pricing</a>
  </nav>
  <div class="actions">
    <a href="#">Contact Us</a>
    <button>SIGN IN</button>
  </div>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Face Your Interviews <br> With Remasto Confidence</h1>
    
    <div class="job-toggle">
      <label>Job</label>
      <input type="checkbox" checked> Internship
    </div>
    
    <div class="search-bar">
      <input type="text" placeholder="Search position">
      <button>START PRACTICE</button>
    </div>
    
    <a href="#" class="sample-link">Sample Analytics</a>
  </div>
  
  <div class="hero-image">
    <img src="your-analytics-image.png" alt="Analytics Preview">
  </div>
</section>

</body>
</html>
